name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm clean-install
          npm install lightningcss@latest
          npm install @tailwindcss/oxide-linux-x64-gnu
          npm rebuild lightningcss --platform=linux --arch=x64
          npm rebuild

      - name: Build
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload to Hostinger
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: out

      - name: Upload to Hostinger
        run: |
          lftp -c "set ftp:ssl-allow on; set ssl:verify-certificate false; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ftp://145.223.108.80; mirror -Rev out/ /public_html/dev/ --ignore-time --parallel=10"
