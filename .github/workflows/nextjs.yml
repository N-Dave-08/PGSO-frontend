name: Deploy Next.js 15 to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: nextjs-build
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: nextjs-build
          path: out

      - name: Upload to Hostinger
        run: |
          lftp -c "set ftp:ssl-allow on; open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ftp://145.223.108.80; mirror -Rev out/ ./ --ignore-time --parallel=10"
