name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm clean-install --legacy-peer-deps
          npm install lightningcss@latest --legacy-peer-deps
          npm install @tailwindcss/oxide-linux-x64-gnu --legacy-peer-deps
          npm rebuild lightningcss --platform=linux --arch=x64
          npm rebuild

      - name: Build
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST || '145.223.108.80' }}

    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: out

      - name: Deploy to Hostinger via FTP
        run: |
          lftp -c "set ftp:ssl-allow on; 
                  set ssl:verify-certificate false; 
                  open -u ${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }} ftp://${{ env.FTP_HOST }}; 
                  mirror -Rev out/ /public_html/dev/ --ignore-time --parallel=10" || { echo "FTP upload failed"; exit 1; }
